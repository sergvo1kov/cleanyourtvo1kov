# Fork-only: builds Flick AirPlay (addons/airplay) and publishes it as the "airplay-v<version>" release.
name: Build Flick AirPlay

on:
  push:
    branches: [main]
    paths: ["addons/airplay/**", ".github/workflows/build-airplay.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  airplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # Same signing key as the launchers, so a new build installs over the previous one on the TV.
      - name: Use the fork's fixed debug key
        run: |
          mkdir -p ~/.android
          cp launcher/ci-debug.keystore ~/.android/debug.keystore
      - name: Build
        working-directory: addons/airplay
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleGoogletvRelease
      - name: Publish the version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' addons/airplay/app/build.gradle.kts | head -1)
          [ -n "$ver" ] || exit 1
          apk=$(ls addons/airplay/app/build/outputs/apk/googletv/release/*.apk | head -1)
          cp "$apk" "flick-airplay-$ver.apk"
          ls -l "flick-airplay-$ver.apk"
          if gh release view "airplay-v$ver" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "airplay-v$ver" "flick-airplay-$ver.apk" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "airplay-v$ver" "flick-airplay-$ver.apk" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Flick AirPlay $ver" --notes "Flick AirPlay $ver: a standalone AirPlay receiver for the TV, based on PhairPlay (Apache 2.0). By Serhii Volkov (@sergvo1kov)."
          fi
