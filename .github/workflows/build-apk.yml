# Fork-only: builds the launcher APK on GitHub and offers it for download
# (Actions tab -> latest "Build launcher APK" run -> Artifacts -> launcher-apk).
name: Build launcher APK

on:
  push:
    branches: [main]
    paths: ["launcher/**", "addons/dim/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # Same signing key every run, so a new build installs over the previous one on the TV.
      - name: Use the fork's fixed debug key
        run: |
          mkdir -p ~/.android
          cp launcher/ci-debug.keystore ~/.android/debug.keystore
      - name: Build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Build the Dim add-on
        working-directory: addons/dim
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Name the APKs
        run: |
          mkdir out
          cp launcher/app/build/outputs/apk/release/app-release.apk "out/tvhome-${GITHUB_SHA::7}.apk"
          cp addons/dim/app/build/outputs/apk/release/app-release.apk "out/dim-${GITHUB_SHA::7}.apk"
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tv-apks
          path: out/*.apk
          retention-days: 30
      # Fork-only: the same two APKs under fixed names, so the TV setup script can fetch them by URL.
      - name: Publish as the "latest-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk out/tvhome.apk
          cp addons/dim/app/build/outputs/apk/release/app-release.apk out/dim.apk
          gh release delete latest-build -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest-build out/tvhome.apk out/dim.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Latest build ${GITHUB_SHA::7}" --notes "Built from ${GITHUB_SHA}" --prerelease
