# Fork-only: builds the launcher APK on GitHub and offers it for download
# (Actions tab -> latest "Build launcher APK" run -> Artifacts -> launcher-apk).
name: Build launcher APK

on:
  push:
    branches: [main]
    paths: ["launcher/**", "addons/dim/**", "addons/glass/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # Same signing key every run, so a new build installs over the previous one on the TV.
      - name: Use the fork's fixed debug key
        run: |
          mkdir -p ~/.android
          cp launcher/ci-debug.keystore ~/.android/debug.keystore
      - name: Build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Build the Dim add-on
        working-directory: addons/dim
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease assembleRelease
      - name: Build Flick TV Glass
        working-directory: addons/glass
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Lint summary as an annotation
        run: |
          f=addons/dim/app/build/reports/lint-results.txt
          [ -f "$f" ] || exit 0
          body=$(grep -E ": (Error|Warning):" "$f" | sed -E 's#^.*/src/main/##' | head -80 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Dim lint::$(tail -1 "$f")%0A$body"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dim-lint
          path: addons/dim/app/build/reports/lint-results*
          retention-days: 30
      - name: Name the APKs
        run: |
          mkdir out
          cp launcher/app/build/outputs/apk/release/app-release.apk "out/tvhome-${GITHUB_SHA::7}.apk"
          cp addons/dim/app/build/outputs/apk/release/app-release.apk "out/dim-${GITHUB_SHA::7}.apk"
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tv-apks
          path: out/*.apk
          retention-days: 30
      # Fork-only: the same two APKs under fixed names, so the TV setup script can fetch them by URL.
      - name: Publish as the "latest-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk out/tvhome.apk
          cp addons/dim/app/build/outputs/apk/release/app-release.apk out/dim.apk
          cp addons/glass/app/build/outputs/apk/release/app-release.apk out/glass.apk
          gh release delete latest-build -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest-build out/tvhome.apk out/dim.apk out/glass.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Latest build ${GITHUB_SHA::7}" --notes "Built from ${GITHUB_SHA}" --prerelease
      # Fork-only: a versioned Flick TV release (APK + installer zip), once per versionName.
      - name: Publish the Flick TV version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' addons/dim/app/build.gradle)
          [ -n "$ver" ] || exit 0
          mkdir -p "rel/Flick-TV-$ver"
          cp addons/dim/app/build/outputs/apk/release/app-release.apk "rel/Flick-TV-$ver/flick-tv-$ver.apk"
          cp addons/dim/install/install.ps1 addons/dim/install/УСТАНОВИТЬ.bat addons/dim/install/ИНСТРУКЦИЯ.txt \
            addons/dim/install/reset-google-tv.ps1 addons/dim/install/ВЕРНУТЬ-GOOGLE-TV.bat "rel/Flick-TV-$ver/"
          sed -i "s/flick-tv-2.0.apk/flick-tv-$ver.apk/" "rel/Flick-TV-$ver/install.ps1"
          (cd rel && zip -qr "Flick-TV-$ver.zip" "Flick-TV-$ver")
          # a version's release is kept up to date with the newest build of that version
          if gh release view "v$ver" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$ver" "rel/Flick-TV-$ver.zip" "rel/Flick-TV-$ver/flick-tv-$ver.apk" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "v$ver" --notes-file addons/dim/RELEASE_NOTES.md -R "$GITHUB_REPOSITORY"
          else
            gh release create "v$ver" "rel/Flick-TV-$ver.zip" "rel/Flick-TV-$ver/flick-tv-$ver.apk" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Flick TV $ver" --notes-file addons/dim/RELEASE_NOTES.md
          fi
      # Fork-only: Flick TV Glass, its own release per versionName (glass-v1.0, ...).
      - name: Publish the Flick TV Glass version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' addons/glass/app/build.gradle)
          [ -n "$ver" ] || exit 0
          cp addons/glass/app/build/outputs/apk/release/app-release.apk "flick-tv-glass-$ver.apk"
          if gh release view "glass-v$ver" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "glass-v$ver" "flick-tv-glass-$ver.apk" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "glass-v$ver" "flick-tv-glass-$ver.apk" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Glass TV $ver" --notes "Glass TV $ver: a tvOS-style home screen, standalone or beside Flick TV. By Serhii Volkov (@sergvo1kov)."
          fi
