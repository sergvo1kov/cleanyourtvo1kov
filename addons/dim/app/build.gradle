plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.volkov.dim'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.volkov.dim'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded like the launcher, signed with the fork's fixed debug key (see the build workflow).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
