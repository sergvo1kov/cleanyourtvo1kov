plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.volkov.dim'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.volkov.dim'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.0"
    }

    // Fork: one fixed key for every build, so a new APK installs over the last one on the TV.
    signingConfigs {
        fork {
            storeFile rootProject.file('../../launcher/ci-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded like the launcher, signed with the fork's fixed debug key (see the build workflow).
            signingConfig signingConfigs.fork
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
